<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nitant Wanjari portfolio landing page with an interactive fluid motion background."
    />
    <title>Nitant Wanjari | Tech, Sales & Marketing, Immersive Media</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" aria-labelledby="hero-title">
      <canvas id="fluid-canvas" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>

      <section class="hero__content">
        <p class="hero__eyebrow">Tech . Sales &amp; Marketing . Immersive Media</p>
        <h1 id="hero-title">Nitant Wanjari</h1>
      </section>

      <button
        class="customise-toggle"
        type="button"
        aria-controls="parameter-panel"
        aria-expanded="false"
      >
        Customise
      </button>

      <aside class="parameter-panel" id="parameter-panel" aria-label="Fluid parameter controls" hidden>
        <div class="parameter-panel__header">
          <h2>Fluid Parameters</h2>
          <button class="parameter-panel__close" type="button" aria-label="Close parameter controls">×</button>
        </div>

        <label class="control">
          <span>Motion</span>
          <input data-setting="motion" type="range" min="0.25" max="2.5" step="0.05" value="1" />
        </label>

        <label class="control">
          <span>Glow</span>
          <input data-setting="glow" type="range" min="0.15" max="1.4" step="0.05" value="0.7" />
        </label>

        <label class="control">
          <span>Cursor Force</span>
          <input data-setting="cursorForce" type="range" min="0.3" max="2.8" step="0.05" value="1.25" />
        </label>

        <label class="control">
          <span>Fade</span>
          <input data-setting="fade" type="range" min="0.06" max="0.34" step="0.01" value="0.16" />
        </label>
      </aside>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
